<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Final Challenge</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    font-family:Arial, sans-serif;
    background:#f2f2f2;
    text-align:center;
}

main{
    width:90%;
    max-width:700px;
    margin:auto;
}

ul{
    padding:0;
}

li{
    color: goldenrod;
    list-style:none;
    background:#2c3e50;
    margin:10px;
    padding:15px;
    border-radius:10px;
    font-size:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.controls button{
    margin-left:5px;
    width:40px;
    height:40px;
    font-size:18px;
}

.success{
    color:green;
    font-weight:bold;
}

.error{
    color:red;
    font-weight:bold;
}

#orderSection{
    display:none;
}

#finishButton{
    display:none;
    margin-top:30px;
}

</style>

</head>

<body>

<header>

<h1>The Mystery of the Lost Train</h1>

</header>

<main>

<h2>Puzzle 1</h2>

<p>

I carry people without feet.<br>
I travel without sleep.<br>
My path is made of steel.<br><br>

What am I?

</p>

<input
id="answer"
type="text"
placeholder="Your answer">

<button onclick="checkRiddle()">

Submit

</button>

<p id="riddleResult"></p>

<hr>

<div id="orderSection">

<h2>Puzzle 2</h2>

<p>

Arrange the clues in the correct order using ▲ and ▼.

</p>

<ul id="clueList">

<li>

<span>Brass Key</span>

<div class="controls">

<button onclick="moveUp(this)">▲</button>

<button onclick="moveDown(this)">▼</button>

</div>

</li>

<li>

<span>Tunnel</span>

<div class="controls">

<button onclick="moveUp(this)">▲</button>

<button onclick="moveDown(this)">▼</button>

</div>

</li>

<li>

<span>Journal</span>

<div class="controls">

<button onclick="moveUp(this)">▲</button>

<button onclick="moveDown(this)">▼</button>

</div>

</li>

<li>

<span>Hidden Cave</span>

<div class="controls">

<button onclick="moveUp(this)">▲</button>

<button onclick="moveDown(this)">▼</button>

</div>

</li>

<li>

<span>Map</span>

<div class="controls">

<button onclick="moveUp(this)">▲</button>

<button onclick="moveDown(this)">▼</button>

</div>

</li>

</ul>

<button onclick="checkOrder()">

Check Order

</button>

<p id="orderResult"></p>

</div>

<div id="finishButton">

<a href="ending.html">

<button>

Unlock the Lost Train

</button>

</a>

</div>

</main>

<script>

function checkRiddle(){

let answer=document
.getElementById("answer")
.value
.trim()
.toLowerCase();

if(answer==="train"){

document.getElementById("riddleResult").innerHTML=
"<span class='success'>Correct! You earned the Brass Key.</span>";

document.getElementById("orderSection").style.display="block";

}else{

document.getElementById("riddleResult").innerHTML=
"<span class='error'>Incorrect. Try again.</span>";

}

}

function moveUp(button){

let item=button.closest("li");

let prev=item.previousElementSibling;

if(prev){

item.parentNode.insertBefore(item,prev);

}

}

function moveDown(button){

let item=button.closest("li");

let next=item.nextElementSibling;

if(next){

item.parentNode.insertBefore(next,item);

}

}

function checkOrder(){

const correct=[

"Journal",
"Map",
"Tunnel",
"Brass Key",
"Hidden Cave"

];

const current=[

...document.querySelectorAll("#clueList li span")

].map(span=>span.textContent);

if(JSON.stringify(correct)===JSON.stringify(current)){

document.getElementById("orderResult").innerHTML=
"<span class='success'>Excellent! The cave door opens!</span>";

document.getElementById("finishButton").style.display="block";

}else{

document.getElementById("orderResult").innerHTML=
"<span class='error'>That order is incorrect. Try again!</span>";

}

}

</script>

</body>
</html>
